name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      # Install Foundry from its release tarball instead of running foundryup.
      #
      # `foundry-rs/foundry-toolchain@v1` shells out to foundryup, and on
      # 8 Nov 2026 that failed all day: GitHub answered 504 for
      # `foundryup_linux_amd64` and for the release attestation file, three
      # times in a row inside a single job, so retrying was not enough and a
      # release sat blocked on a check that could not pass.
      #
      # It was never GitHub being down, which is what it looked like and what
      # was written here first. Measured the same day from outside CI: the
      # binaries themselves,
      # `foundry_v1.9.0_linux_amd64.tar.gz`, answered 200 four times in a row
      # and delivered all 118 MB, while foundryup and the attestation kept
      # answering 504. Two specific assets were broken, not the service. So
      # take the tarball and skip the installer that cannot be fetched.
      #
      # This also pins the version, which the action did not: it resolved
      # "latest" on every run, so a Foundry release could change what CI
      # means with no commit here. Bumping is now a visible edit.
      #
      # The tarball holds forge, cast, anvil, chisel and solar flat at the
      # root; verified by extracting it and running `forge --version`.
      - name: Install Foundry
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://github.com/foundry-rs/foundry/releases/download/v${FOUNDRY_VERSION}/foundry_v${FOUNDRY_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/foundry.tar.gz
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf /tmp/foundry.tar.gz -C "$HOME/.foundry/bin"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          "$HOME/.foundry/bin/forge" --version
        env:
          FOUNDRY_VERSION: 1.9.0

      - name: Install contract deps
        # lib/ is gitignored, so CI installs the pinned deps explicitly.
        run: |
          forge install foundry-rs/forge-std@v1.16.1
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.4.0

      - name: Run tests
        run: forge test -vvv

  web:
    name: Web (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # Catches Turbopack / Next-only failures that pass tsc + eslint alone
        # (server-only imports in client components, PPR boundary violations,
        # missing generateMetadata returns). Hardcoded placeholder
        # DATABASE_URL prevents route handlers that read process.env eagerly
        # from crashing the static-generation phase. Value is a literal, not
        # from GitHub event input, so no workflow injection risk.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run build

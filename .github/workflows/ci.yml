name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      # Foundry comes from a cache first and the release tarball second, and
      # neither of those is how it used to work. The history matters because
      # I got it wrong twice.
      #
      # `foundry-rs/foundry-toolchain@v1` shells out to foundryup, and on
      # 8 Nov 2026 the contracts job failed all day on a 504 fetching
      # `foundryup_linux_amd64`. First call: GitHub release downloads are
      # down, add retries. Wrong, and three retries failed in one job.
      # Second call: only foundryup and the attestation are broken, because
      # from the VPS the binaries answered 200 four times in a row and
      # delivered all 118 MB. Also wrong: with the tarball in place the job
      # passed once and then failed with four 504s on that same tarball.
      #
      # What is actually true is that the 504s are intermittent and the
      # runners see them while other networks do not, so no single download
      # is reliable and a 15-second retry window is not patience, it is
      # optimism.
      #
      # So: cache the extracted binaries under the pinned version, and only
      # reach for the network when that misses. One good download serves
      # every later run, which takes CI off the CDN instead of hoping. When
      # it does have to download, it now keeps trying for three minutes.
      #
      # The version is pinned, which the action never was: it resolved
      # "latest" on every run, so a Foundry release could change what CI
      # means with no commit here. Bumping is a visible edit and it busts the
      # cache key by itself.
      #
      # The tarball holds forge, cast, anvil, chisel and solar flat at the
      # root; verified by extracting it and running `forge --version`.
      - name: Cache Foundry
        id: foundry-cache
        uses: actions/cache@v4
        with:
          path: ~/.foundry/bin
          key: foundry-1.9.0-linux-amd64

      - name: Download Foundry
        if: steps.foundry-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL --retry 8 --retry-delay 15 --retry-max-time 180 \
            "https://github.com/foundry-rs/foundry/releases/download/v${FOUNDRY_VERSION}/foundry_v${FOUNDRY_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/foundry.tar.gz
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf /tmp/foundry.tar.gz -C "$HOME/.foundry/bin"
        env:
          FOUNDRY_VERSION: 1.9.0

      # Unconditional: a cache hit still needs the directory on PATH, and
      # running the binary proves the cache is not a stale empty directory.
      - name: Put Foundry on PATH
        working-directory: ${{ github.workspace }}
        run: |
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          "$HOME/.foundry/bin/forge" --version

      - name: Install contract deps
        # lib/ is gitignored, so CI installs the pinned deps explicitly.
        run: |
          forge install foundry-rs/forge-std@v1.16.1
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.4.0

      - name: Run tests
        run: forge test -vvv

  web:
    name: Web (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # Catches Turbopack / Next-only failures that pass tsc + eslint alone
        # (server-only imports in client components, PPR boundary violations,
        # missing generateMetadata returns). Hardcoded placeholder
        # DATABASE_URL prevents route handlers that read process.env eagerly
        # from crashing the static-generation phase. Value is a literal, not
        # from GitHub event input, so no workflow injection risk.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run build

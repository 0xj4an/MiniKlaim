name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      # Three attempts, because this step downloads from GitHub's own release
      # CDN and that CDN is not reliable. On 8 Nov 2026 it answered 504 for
      # `foundryup_linux_amd64` and for the v1.9.0 attestation for hours,
      # with one brief window where it worked, and this job failed eight
      # times in a row. Nothing was wrong with the contracts: the diff did
      # not touch a single Solidity file, and `main` requires this check, so
      # a release sat blocked on someone else's outage.
      #
      # `continue-on-error` only covers the first two tries. The third has no
      # net, so a real failure still fails the job and the tests still have
      # to pass: this buys another roll of the dice against a flaky download,
      # not a way around a red build.
      - name: Install Foundry
        id: foundry1
        uses: foundry-rs/foundry-toolchain@v1
        continue-on-error: true

      - name: Install Foundry (retry 1)
        id: foundry2
        if: steps.foundry1.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1
        continue-on-error: true

      - name: Install Foundry (retry 2)
        if: steps.foundry1.outcome == 'failure' && steps.foundry2.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install contract deps
        # lib/ is gitignored, so CI installs the pinned deps explicitly.
        run: |
          forge install foundry-rs/forge-std@v1.16.1
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.4.0

      - name: Run tests
        run: forge test -vvv

  web:
    name: Web (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # Catches Turbopack / Next-only failures that pass tsc + eslint alone
        # (server-only imports in client components, PPR boundary violations,
        # missing generateMetadata returns). Hardcoded placeholder
        # DATABASE_URL prevents route handlers that read process.env eagerly
        # from crashing the static-generation phase. Value is a literal, not
        # from GitHub event input, so no workflow injection risk.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run build
